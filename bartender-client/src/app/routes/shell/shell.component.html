<div class="shell" [class.nav-open]="navOpen()">

  <!-- Sidebar -->
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <span class="brand-icon">🍸</span>
      <span class="brand-text">Bartender</span>
      <span class="spacer"></span>
      <button class="chip ghost" type="button" (click)="navOpen.set(false)">Hide</button>
    </div>

    <nav class="nav">
      @for (item of nav(); track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          (click)="navOpen.set(false)"
        >
          <span class="icon">{{ item.icon }}</span>
          <span class="label">{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <!-- Handle button (only when sidebar is collapsed) -->
  <button
    class="nav-handle"
    type="button"
    (click)="navOpen.set(true)"
    aria-label="Open menu"
    title="Open menu"
  >
    ☰
  </button>

  <!-- Main content -->
  <main class="content">
    <div class="topbar">
      <button class="chip ghost" type="button" (click)="toggleNav()">
        {{ navOpen() ? 'Hide menu' : 'Menu' }}
      </button>
      <div class="spacer"></div>
    </div>

    <div class="page">
      <router-outlet />
    </div>
  </main>

  <!-- Scrim (mobile overlay) -->
  <div class="scrim" (click)="navOpen.set(false)"></div>

</div>
